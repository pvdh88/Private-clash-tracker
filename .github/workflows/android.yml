name: Android
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using the saved signing key"
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret, a new random debug key will be used"
          fi
      - name: Apply home screen headline patch
        run: python3 .github/patches/apply_headline.py
      - name: Commit the patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -am "Home screen: show the village name as the headline"
            git push || echo "Push skipped"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: clash-ledger-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Build the watch app
        continue-on-error: true
        run: ./gradlew :wear:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: clash-ledger-wear-debug
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
      - name: Publish the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk clash-ledger.apk
          cat > release-notes.md <<'EOF'
          # Clash Ledger

          A free, unofficial companion app for Clash of Clans: upgrade timers across all your villages, home screen widgets, and ranked attack tracking.

          ## Install
          1. Download clash-ledger.apk below on your Android phone.
          2. Open it and allow installs from your browser or file manager if asked.
          3. Later builds install over the top as long as they use the same signing key.

          ## Privacy
          All data stays on your device. The optional ranked attack feature sends only your player tags to the Clash of Clans API (or the proxy you choose) using your own API token.

          ## Disclaimer
          This is unofficial fan content and is not affiliated with or endorsed by Supercell. Clash of Clans and related artwork are the property of Supercell. Released under the MIT License.
          EOF
          sed -i 's/^          //' release-notes.md
          gh release delete latest --cleanup-tag -y || true
          gh release create latest clash-ledger.apk --title "Clash Ledger (latest build)" --notes-file release-notes.md --target "$GITHUB_SHA"
